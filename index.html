function notify(s){

function minutes(t){
 const p=String(t).split(":"); return (+p[0]||0)*60+(+p[1]||0);
}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('\"',"&quot;").replaceAll("'","&#039;")}
function num(v){const n=Number(String(v??"").replace(/[₹$€£,\s]/g,""));return Number.isFinite(n)?n:0}
function normalizeHeader(v){return String(v??"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")}
function headerIndex(headers,aliases){const normalized=headers.map(normalizeHeader); for(const a of aliases){const i=normalized.indexOf(a);if(i>=0)return i} return -1}
function normalizeRow(r,i,m){
 const id=r[m.id]>=0?r[m.id]:-1, ts=r[m.ts]>=0?r[m.ts]:-1, s=r[m.sender]>=0?r[m.sender]:-1, rec=r[m.receiver]>=0?r[m.receiver]:-1, am=r[m.amount]>=0?r[m.amount]:-1, cu=r[m.currency]>=0?r[m.currency]:-1;
 return [id>=0&&r[id]?r[id]:"TX"+String(i+1).padStart(3,"0"),ts>=0&&r[ts]?r[ts]:"00:00",s>=0&&r[s]?r[s]:"",rec>=0&&r[rec]?r[rec]:"",am>=0?num(r[am]):0,cu>=0&&r[cu]?r[cu]:"INR",r];
}
function detectMapping(headers){
 return {
  id:headerIndex(headers,["transaction_id","transactionid","tx_id","txid","id","reference","ref"]),
  ts:headerIndex(headers,["timestamp","time","datetime","date_time","date"]),
  sender:headerIndex(headers,["sender","from","source","source_account","sender_account","payer","origin"]),
  receiver:headerIndex(headers,["receiver","to","destination","destination_account","receiver_account","payee","beneficiary"]),
  amount:headerIndex(headers,["amount","transaction_amount","value","amt","amount_inr","amount_usd"]),
  currency:headerIndex(headers,["currency","ccy","curr","currency_code"])
 };
}
function detectCycle(){
 const out=[];
 const map=new Map(tx.map(t=>[t[2],t]));
 for(const first of tx){
   let cur=first[2], path=[], seen=new Set();
   for(let step=0;step<8;step++){
     if(seen.has(cur)) break;
     seen.add(cur); path.push(cur);
     const e=map.get(cur); if(!e) break;
     cur=e[3];
     if(cur===first[2] && path.length>=3){
       const uniq=[...new Set(path)];
       if(uniq.length>=3 && !out.some(x=>x.accounts.join("|")===uniq.join("|")))
         out.push({accounts:uniq, count:uniq.length});
       break;
     }
   }
 }
 return out;
}
function detectChains(){
 const result=[];
 const sorted=[...tx].sort((a,b)=>minutes(a[1])-minutes(b[1]));
 for(let i=0;i<sorted.length-2;i++){
   let path=[sorted[i][2],sorted[i][3]], ids=[sorted[i][0]];
   for(let j=i+1;j<sorted.length && path.length<7;j++){
     if(minutes(sorted[j][1])-minutes(sorted[j-1][1])<=30 && sorted[j][2]===path[path.length-1]){
       path.push(sorted[j][3]);ids.push(sorted[j][0]);
     }
   }
   if(path.length>=4) result.push({accounts:[...new Set(path)],ids});
 }
 return result;
}
function analyze(){
 alerts=[];
 if(!tx.length){render();return}
 const add=(pattern,accounts,score,explanation,evidence=[])=>{
   score=Math.max(0,Math.min(100,Math.round(score)));
   alerts.push({id:"ALERT-"+String(alerts.length+1).padStart(3,"0"),pattern,accounts,score,
     level:score>=70?"HIGH":score>=40?"MEDIUM":"LOW",explanation,evidence});
 };

 const cycles=detectCycle();
 cycles.slice(0,3).forEach(c=>{
   const vals=tx.filter(t=>c.accounts.includes(t[2])&&c.accounts.includes(t[3])).map(t=>t[4]);
   const avg=vals.reduce((a,b)=>a+b,0)/(vals.length||1);
   const score=factors.network*.55+factors.amount*.25+factors.velocity*.20;
   add("Circular Flow",c.accounts,score,
     `${c.count} connected accounts form a closed transaction cycle. Network weight ${factors.network}% and amount similarity weight ${factors.amount}% contributed to the risk score.`,
     tx.filter(t=>c.accounts.includes(t[2])||c.accounts.includes(t[3])).slice(0,10).map(t=>t[0]));
 });

 const chains=detectChains();
 if(chains[0]){
   const c=chains[0];
   const score=factors.velocity*.65+factors.network*.25+factors.amount*.10+10;
   add("Layering / Rapid Chain",c.accounts,score,
     `A sequential chain of ${c.accounts.length} connected entities was detected within short time intervals. Velocity weight ${factors.velocity}% is applied.`,
     c.ids);
 }

 const countsIn={},countsOut={};
 tx.forEach(t=>{countsIn[t[3]]=(countsIn[t[3]]||0)+1;countsOut[t[2]]=(countsOut[t[2]]||0)+1});
 Object.entries(countsIn).filter(([_,n])=>n>=3).slice(0,3).forEach(([hub,n])=>{
   const acc=[hub,...tx.filter(t=>t[3]===hub).map(t=>t[2])];
   const score=factors.fan*2.4+factors.network*.35;
   add("Fan-In",acc,score,`${n} source accounts send funds into the common hub ${hub}. Fan-in weight ${factors.fan}% is included.`,tx.filter(t=>t[3]===hub).map(t=>t[0]));
 });
 Object.entries(countsOut).filter(([_,n])=>n>=3).slice(0,3).forEach(([hub,n])=>{
   const acc=[hub,...tx.filter(t=>t[2]===hub).map(t=>t[3])];
   const score=factors.fan*2.4+factors.network*.35;
   add("Fan-Out",acc,score,`${hub} distributes funds to ${n} connected accounts. Fan-out weight ${factors.fan}% is included.`,tx.filter(t=>t[2]===hub).map(t=>t[0]));
 });

 const amounts=tx.map(t=>t[4]).filter(Boolean);
 const highAmount=amounts.length?Math.max(...amounts):0;
 const threshold=Number(document.getElementById("amountThreshold")?.value||Math.max(50000,highAmount*.8));
 const highTx=tx.filter(t=>t[4]>=threshold);
 if(highTx.length){
   const score=Math.min(100,30+factors.amount*1.5+factors.rounding*.5);
   add("High-Value Input", [...new Set(highTx.flatMap(t=>[t[2],t[3]]))],score,
     `${highTx.length} transaction(s) meet or exceed the configured amount threshold of ₹${threshold.toLocaleString()}. This is an input analysis factor, not a legal conclusion.`,
     highTx.map(t=>t[0]));
 }

 const suspicious=tx.filter(t=>{
   const a=String(t[4]); return a.endsWith("000")||a.endsWith("500")||a.endsWith("00");
 });
 if(suspicious.length>=3){
   const score=Math.min(100,20+factors.rounding*1.8+factors.amount*.3);
   add("Amount Pattern", [...new Set(suspicious.flatMap(t=>[t[2],t[3]]))],score,
     `${suspicious.length} transactions contain simple rounded amount patterns. Rounding weight ${factors.rounding}% is applied.`,
     suspicious.slice(0,10).map(t=>t[0]));
 }
 alerts.sort((a,b)=>b.score-a.score);
 alerts.forEach((a,i)=>a.id="ALERT-"+String(i+1).padStart(3,"0"));
}

function csvUpload(e){
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  const text=String(r.result||"").replace(/^\uFEFF/,"").trim();
  if(!text){notify("CSV is empty");return}
  const headerLine=text.split(/\r?\n/)[0];
   const comma=(headerLine.match(/,/g)||[]).length, semi=(headerLine.match(/;/g)||[]).length, tab=(headerLine.match(/\t/g)||[]).length;
   const delim=tab>comma&&tab>semi?"\t":(semi>comma?";":",");
  const lines=text.split(/\r?\n/).filter(x=>x.trim()!=="");
  csvHeaders=parseCSVLine(lines[0],delim).map(x=>String(x).trim());
  const map=detectMapping(csvHeaders);
  if(map.sender<0||map.receiver<0||map.amount<0){notify("CSV needs sender, receiver and amount columns");return}
  tx=lines.slice(1).map(line=>parseCSVLine(line,delim)).filter(row=>row.some(v=>String(v).trim()!=="")).map((row,i)=>normalizeRow(row,i,map));
  dataSource=f.name;
  currentAlert=null;
  analyze();render();notify(`${tx.length} CSV records received and analyzed`);
 };
 r.readAsText(f);
}

function parseCSVLine(line,delimiter=","){
 const out=[];let cur="",q=false;
 for(let i=0;i<line.length;i++){const c=line[i];
  if(c==='"' && line[i+1]==='"'){cur+='"';i++}
  else if(c==='"')q=!q;
  else if(c===delimiter&&!q){out.push(cur.trim());cur=""}
  else cur+=c;
 }
 out.push(cur.trim());return out;
}
function network(){
 let accounts=[...new Set(tx.flatMap(t=>[t[2],t[3]]))],pos={};
 accounts.forEach((a,i)=>pos[a]={x:5+(i%6)*17,y:45+Math.floor(i/6)*120});
 let risk=new Set(alerts.flatMap(a=>a.accounts));
 let edges=tx.slice(0,50).map(t=>{let a=pos[t[2]],b=pos[t[3]];if(!a||!b)return"";
   let dx=b.x-a.x,dy=b.y-a.y,len=Math.sqrt(dx*dx+dy*dy),ang=Math.atan2(dy,dx)*180/Math.PI;
   return `<div class="edge ${risk.has(t[2])||risk.has(t[3])?"risk":""}" style="left:${a.x}%;top:${a.y}px;width:${len}%;transform:rotate(${ang}deg)"></div>`;
 }).join("");
 return `<section class="page"><div class="title"><div><h2>Transaction Network</h2><p class="muted">Relationships reveal what isolated transactions cannot. Risk nodes reflect current analysis.</p></div></div><div class="network">${edges}${accounts.map(a=>`<div class="node ${risk.has(a)?"high":""}" style="left:${pos[a].x}%;top:${pos[a].y}px"><b>${a}</b><small>${risk.has(a)?"HIGH RISK":"CONNECTED"}</small></div>`).join("")}</div></section>`;
}
function alertPage(){
 return `<section class="page"><div class="title"><div><h2>Explainable Alerts</h2><p class="muted">Risk is prioritized with configurable input factors and evidence.</p></div><button class="primary" onclick="go('Dashboard')">Adjust Factors</button></div><div class="alerts">${alerts.map(a=>`<div class="alert"><div class="head"><span class="badge ${a.level.toLowerCase()}">${a.level}</span><b>${a.score}/100</b></div><h3>${a.pattern}</h3><p>${a.explanation}</p><small>${a.accounts.join(" → ")}</small><div>${a.evidence.slice(0,6).map(x=>`<span class="pill">${x}</span>`).join("")}</div><button class="secondary" style="width:100%;margin-top:10px" onclick="investigate('${a.id}')">Investigate</button></div>`).join("")||'<div class="panel"><p class="muted">No alerts yet.</p></div>'}</div></section>`;
}
function investigations(){
 let a=currentAlert;
 if(!a)return `<section class="page"><div class="panel" style="padding:70px;text-align:center"><h2>No investigation selected</h2><p class="muted">Open an alert and click Investigate.</p></div></section>`;
 let saved=localStorage.getItem("notes_"+a.id)||"";
 return `<section class="page"><div class="title"><div><h2>Investigation CASE-${a.id.slice(-3)}</h2><p class="muted">Human review required · prototype evidence only</p></div><span class="badge ${a.level.toLowerCase()}">${a.score}/100 ${a.level}</span></div>
 <div class="invest"><div class="panel"><h3>Explainable Evidence</h3><div class="score">${a.score}</div><h3>${a.pattern}</h3><p class="muted">${a.explanation}</p><h4>Accounts</h4><p style="color:#61d9b8">${a.accounts.join(" → ")}</p><h4>Evidence Timeline</h4>${tx.filter(t=>a.accounts.includes(t[2])||a.accounts.includes(t[3])).slice(0,12).map(t=>`<div class="timeline"><b>${t[0]}</b> · ${t[2]} → ${t[3]} · ₹${Number(t[4]).toLocaleString()}<span>${t[1]} · ${t[5]||"INR"} · matched analysis evidence</span></div>`).join("")}</div>
 <div class="panel"><h3>Investigator Notes</h3><textarea id="notes" placeholder="Record investigation observations…">${saved}</textarea><div class="buttons"><button class="secondary" onclick="saveNotes('${a.id}')">Save Notes</button><button class="primary" onclick="notify('Case marked Under Review')">Mark Under Review</button><button class="secondary" onclick="notify('Case escalated')">Escalate</button><button class="secondary" onclick="exportCase('${a.id}')">Export Case</button></div></div></div></section>`;
}
function saveNotes(id){localStorage.setItem("notes_"+id,document.getElementById("notes").value);notify("Notes saved locally");}
function investigate(id){currentAlert=alerts.find(a=>a.id===id);go("Investigations")}
function go(p){page=p;render()}
function exportTransactions(){
 const headers=csvHeaders.length?csvHeaders:["transaction_id","timestamp","sender","receiver","amount","currency"];
 const rows=tx.map(t=>t[6]&&t[6].length?t[6]:t.slice(0,headers.length));
 const data=[headers,...rows].map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n");
 download("tracex_transactions.csv",data,"text/csv");notify("Transaction data exported");
}
function exportCase(id){
 const a=alerts.find(x=>x.id===id);if(!a)return;
 const data={case_id:id,pattern:a.pattern,score:a.score,level:a.level,accounts:a.accounts,evidence:a.evidence,explanation:a.explanation,factors,exported_at:new Date().toISOString()};
 download("tracex_"+id+".json",JSON.stringify(data,null,2),"application/json");notify("Case exported");
}
function exportCSV(){
 let rows=[["alert_id","pattern","score","level","accounts","explanation"],...alerts.map(a=>[a.id,a.pattern,a.score,a.level,a.accounts.join(" -> "),a.explanation])];
 download("tracex_alerts.csv",rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"),"text/csv");notify("Alert report exported");
}
function download(name,data,type){const blob=new Blob([data],{type});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function login(){return `<div class="login"><div class="loginbox"><div class="logo"><span>◈</span> TRACE-X</div><p class="muted">Transaction Risk Analysis & Circular Evidence Explorer</p><input id="email" value="investigator@trace-x.demo"><input id="pass" type="password" value="TraceX@123"><button class="primary" onclick="doLogin()">Sign in</button><button class="secondary" onclick="doLogin()">Demo Login</button><p style="font-size:11px;color:#657e8a">Prototype demo credentials are pre-filled.</p></div></div>`}
function doLogin(){logged=true;loadDemo()}
function render(){document.getElementById("root").innerHTML=logged?layout():login()}
render();
</script>
